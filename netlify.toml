# Ethicare Resourcing — Netlify configuration

[build]
  publish = "."
  # Privacy guard (7 Oct 2026). Personal welcome books made for individual candidate
  # families must never be served from the public site, even if a copy lands in the repo
  # again. They are removed from every deploy here; the originals belong outside the
  # site folder. Nothing on the site links to them.
  # Archived 8 Oct 2026 (kept in the repo and in the intranet Archive, never served): the 13
  # regional brochures, three old draft guides, and the retired webinar page.
  # Also (7 Oct 2026): working notes, setup SQL and build scripts live in the repo for us,
  # not on the public site — DELETE-THESE.md and friends were readable by anyone.
  command = "rm -f 'assets/downloads/Welcome to Wellington - '*.html 'assets/downloads/Your First Year in Wellington - '*.html && find . -name '*.md' -not -path './.git/*' -not -path './node_modules/*' -not -path './netlify/*' -delete && rm -rf supabase tools __pycache__ && rm -f assets/downloads/*-brochure.pdf 'assets/downloads/Emergency Medicine in New Zealand - Ethicare.html' 'assets/downloads/Moving to New Zealand - Ethicare.html' 'assets/downloads/Moving to New Zealand - The Master Guide.html' webinar-medical-imaging-australia.html"

# Ask Ethicare's server-side LLM proxy lives here. Without this block Netlify
# never bundles it and /.netlify/functions/ask-ethicare returns 404.
[functions]
  directory = "netlify/functions"

# Canonical host: redirect www → apex (301)
[[redirects]]
  from = "https://www.ethicareresourcing.com/*"
  to = "https://ethicareresourcing.com/:splat"
  status = 301
  force = true

# Retired root comparison page → canonical guides URL (301)
[[redirects]]
  # The page answers the question for both countries, so "here" never meant
  # anything on it — renamed to match its own H1 on 28 Sep 2026.
  from = "/can-i-work-here"
  to = "/can-i-work-there"
  status = 301
  force = true

[[redirects]]
  # 6 Oct 2026: the region finder got its proper name. Fragments (#finder) carry across.
  from = "/where-would-we-live"
  to = "/destination-finder"
  status = 301
  force = true

# 7 Oct 2026: the earnings page has a plain name. The old address keeps working.
[[redirects]]
  from = "/is-it-worth-it"
  to = "/what-could-i-earn"
  status = 301
  force = true

[[redirects]]
  from = "/is-it-worth-it.html"
  to = "/what-could-i-earn"
  status = 301
  force = true

