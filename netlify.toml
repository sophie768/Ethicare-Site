# Internal-only surfaces: the Netlify Forms declaration page and the design
# prototypes are reachable but must never be indexed (14 Sep 2026).
# /pack/ itself must never list anything: each space is reached only by its own link.
[[redirects]]
  from = "/pack/"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/_forms/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/prototypes/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/thank-you"
  [headers.values]
    X-Robots-Tag = "noindex"

# 8 Oct 2026: the candidate welcome packs go out through My Plan only. Served, so the link in a
# candidate's space works, but kept out of search.
[[headers]]
  for = "/assets/downloads/*-candidate-welcome-pack.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Content-addressed assets (images, fonts, downloads) never change under the
# same filename — cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Stylesheets and scripts are NOT fingerprinted (site.css, shell.css, move.js),
# so they must be re-checked on every load, exactly like the HTML that calls them.
# 5 Oct 2026: the previous "hour, then stale-while-revalidate for a week" served a
# returning visitor the NEW ask.html with the OLD candidate-context.js for an hour or
# more after every deploy, and ask-mine.js then failed on a function the old script did
# not have. Sophie saw the page do nothing; so would every returning candidate. A
# conditional request is a 304 and a few bytes — the cost of re-checking is nothing
# next to a page that silently does not work after a release.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML must always be checked — content and pricing change.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Candidates' private spaces (/pack/<slug>, see site/pack/README.md). The link is the
# credential — decided 15 Sep 2026, same position as the named PDFs — so the page must
# never sit in a shared cache or a back-button history on a hospital or library machine,
# and never be indexed even if a <meta> tag is lost. Kept last so it wins over /*.css and
# /*.js for pack.css and pack.js too; no-store is the stricter directive either way.
[[headers]]
  for = "/pack/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
